<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="800" fill="transparent"/>
  
  <!-- Growing Plant - Top Left -->
  <g id="plant" opacity="0.12" transform="translate(150, 150)">
    <!-- Pot -->
    <path d="M -30 80 L -40 120 Q -40 140 -20 140 L 20 140 Q 40 140 40 120 L 30 80 Z" fill="white" stroke="white" stroke-width="1.5"/>
    <!-- Soil -->
    <ellipse cx="0" cy="80" rx="30" ry="8" fill="white" opacity="0.6"/>
    <!-- Stem -->
    <line x1="0" y1="80" x2="0" y2="20" stroke="white" stroke-width="2"/>
    <!-- Leaves -->
    <ellipse cx="-20" cy="40" rx="15" ry="25" fill="white" opacity="0.7" transform="rotate(-30 -20 40)"/>
    <ellipse cx="20" cy="40" rx="15" ry="25" fill="white" opacity="0.7" transform="rotate(30 20 40)"/>
    <ellipse cx="0" cy="20" rx="12" ry="20" fill="white" opacity="0.8"/>
  </g>
  
  <!-- Checkmark/Success - Top Right -->
  <g id="checkmark" opacity="0.13" transform="translate(850, 120)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="white" stroke-width="2"/>
    <path d="M -30 0 L -5 25 L 35 -25" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Budget/Pie Chart - Left Bottom -->
  <g id="pie-chart" opacity="0.11" transform="translate(150, 650)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="white" stroke-width="2"/>
    <!-- Pie segments -->
    <path d="M 0 -40 A 40 40 0 0 1 28.3 -28.3 L 0 0 Z" fill="white" opacity="0.6"/>
    <path d="M 28.3 -28.3 A 40 40 0 0 1 40 0 L 0 0 Z" fill="white" opacity="0.7"/>
    <path d="M 40 0 A 40 40 0 0 1 0 40 L 0 0 Z" fill="white" opacity="0.8"/>
    <path d="M 0 40 A 40 40 0 0 1 -28.3 -28.3 L 0 0 Z" fill="white" opacity="0.5"/>
  </g>
  
  <!-- Money Bag - Right Center -->
  <g id="money-bag" opacity="0.12" transform="translate(800, 400)">
    <!-- Bag body -->
    <ellipse cx="0" cy="0" rx="35" ry="45" fill="white" stroke="white" stroke-width="1.5"/>
    <!-- Bag opening -->
    <rect x="-25" y="-45" width="50" height="15" rx="8" fill="white" stroke="white" stroke-width="1.5"/>
    <!-- Drawstring -->
    <line x1="-15" y1="-30" x2="15" y2="-30" stroke="white" stroke-width="2"/>
    <!-- Dollar sign -->
    <text x="0" y="8" font-size="32" font-weight="bold" text-anchor="middle" fill="white" opacity="0.6">$</text>
  </g>
  
  <!-- Savings/Piggy Bank - Top Center -->
  <g id="savings-box" opacity="0.1" transform="translate(500, 180)">
    <!-- Box -->
    <rect x="-40" y="-35" width="80" height="70" rx="8" fill="white" stroke="white" stroke-width="1.5"/>
    <!-- Slot -->
    <rect x="-8" y="-40" width="16" height="10" rx="2" fill="white"/>
    <!-- Lock -->
    <rect x="-12" y="15" width="24" height="18" rx="4" fill="white" opacity="0.5" stroke="white" stroke-width="1"/>
    <circle cx="0" cy="24" r="3" fill="white"/>
  </g>
  
  <!-- Progress Bar - Bottom Right -->
  <g id="progress" opacity="0.11" transform="translate(750, 700)">
    <!-- Background bar -->
    <rect x="-80" y="0" width="160" height="20" rx="10" fill="white" opacity="0.3" stroke="white" stroke-width="1.5"/>
    <!-- Filled bar -->
    <rect x="-80" y="0" width="120" height="20" rx="10" fill="white" opacity="0.7"/>
    <!-- Percentage text -->
    <text x="0" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="white" opacity="0.6">75%</text>
  </g>
  
  <!-- Shield/Security - Left Center -->
  <g id="shield" opacity="0.1" transform="translate(120, 400)">
    <path d="M 0 -50 L 40 -20 L 40 20 Q 0 60 0 60 Q 0 60 -40 20 L -40 -20 Z" fill="white" stroke="white" stroke-width="2"/>
    <!-- Checkmark inside -->
    <path d="M -15 10 L -5 25 L 20 0" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  </g>
  
  <!-- Trending Up - Right Top -->
  <g id="trending" opacity="0.11" transform="translate(850, 400)">
    <!-- Line chart -->
    <polyline points="-50 50,-20 30,10 40,40 10,70 20" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Points -->
    <circle cx="-50" cy="50" r="3" fill="white" opacity="0.6"/>
    <circle cx="-20" cy="30" r="3" fill="white" opacity="0.7"/>
    <circle cx="10" cy="40" r="3" fill="white" opacity="0.8"/>
    <circle cx="40" cy="10" r="3" fill="white" opacity="0.9"/>
    <circle cx="70" cy="20" r="3" fill="white"/>
  </g>
  
  <!-- Decorative Stars -->
  <g id="stars" opacity="0.09">
    <text x="250" y="100" font-size="30">✦</text>
    <text x="750" y="550" font-size="25">✦</text>
    <text x="200" y="750" font-size="22">✦</text>
    <text x="900" y="300" font-size="28">✦</text>
  </g>
</svg>